name: sukoyaka
description: "Sukoyaka: a baby feeding, sleep, diaper, and growth tracker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  google_fonts: ^6.2.1
  home_widget: ^0.9.3
  pdf: ^3.11.0
  shared_preferences: ^2.1.0
  timezone: ^0.10.0
  intl: ^0.18.1
  web: ^1.1.1
  file_picker: ^12.1.2
  share_plus: ^13.3.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4A55C9"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "4A55C9"
  image: "assets/icon/splash_logo.png"
  android_12:
    color: "4A55C9"
    image: "assets/icon/splash_logo.png"
  android: true
  ios: true
  web: false
